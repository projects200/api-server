version: "3"

services:
  server-dev:
    image: "825773631552.dkr.ecr.ap-northeast-2.amazonaws.com/undabang/dev-server-repository:latest"
    restart: always
    container_name: "server-dev"
    ports:
      - "8090:8080"
    networks:
      - dev-server-network
    environment:
      # 개발 서버용 초경량 메모리 설정
      # Xms128m: 시작할 때 128MB로 시작
      # Xmx256m: 최대 256MB까지만 사용
      # -XX:+UseSerialGC: 코어가 적은 CPU에서 효율적
      - JAVA_OPTS=-Xms128m -Xmx256m -XX:+UseSerialGC

networks:
  dev-server-network:
    driver: bridge