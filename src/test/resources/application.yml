spring:
  application:
    name: undabang

  profiles:
    active: local-docs

  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    defer-datasource-initialization: true
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

  sql:
    init:
      mode: always
      data-locations: classpath:test-data.sql    # 테스트 용 데이터 추가 필요할 때 사용

  transaction:
    default-timeout: 30s

  cloud:
    aws:
      s3:
        path-style-access-enabled: true

  servlet:
    multipart:
      max-file-size: 10MB # 개별 파일 최대 크기
      max-request-size: 50MB # 총 요청 최대 크기 (여러 파일 업로드 시)

app:
  s3:
    bucket-name: my-test-image-bucket

logging:
  level:
    com.project200.undabang: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

cors:
  allowed-origins: http://localhost:3000

restdocs:
  uris:
    scheme: https
    host: api.undabang.store
    port: 443

batch:
  jobs:
    chunk-size: 100

slack:
  webhook:
    url:  ""
    enabled:  true

async:
  thread-pool:
    decrease-exercise-score:
      core-pool-size: 10
      max-pool-size: 10
      queue-capacity: 25
      thread-name-prefix: "decreaseExerciseScoreBatchJobExecutor-"
    slack-message-sender:
      core-pool-size: 5
      max-pool-size: 5
      queue-capacity: 10
      thread-name-prefix: "slackMessageSender-"
    general:
      core-pool-size: 5
      max-pool-size: 5
      queue-capacity: 10
      thread-name-prefix: "general-"